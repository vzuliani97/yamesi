server {
  listen 8080;
  server_name _;
  # Answer as plain "nginx": the version in the banner would point attackers at specific CVEs.
  server_tokens off;
  # Photos and receipts are up to 2 MB; nginx rejects bodies over 1 MB by default.
  client_max_body_size 3m;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_set_header Host $host;
    # The API trusts one proxy hop and reads the client IP from here (partner IP allowlist).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://backend:3000/health;
  }

  # index.html is revalidated on every visit so a new deploy reaches browsers at once.
  location / {
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    expires -1;
    try_files $uri /index.html;
  }

  # Build assets carry a content hash in their file name, so browsers may keep them for a year.
  location /assets/ {
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    expires 1y;
  }
}
