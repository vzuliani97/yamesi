# Public demo frontend on Netlify (free plan). The API runs on Render; see docs/PUBLIC_DEMO_DEPLOYMENT.md.
# Everything here is public. The demo password is set in the Netlify UI (VITE_DEMO_PASSWORD), never here.
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"
  # Each production deploy costs free-plan credits: rebuild only when the frontend or this file changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[build.environment]
  NODE_VERSION = "24"
  VITE_PUBLIC_DEMO = "true"
  VITE_API_BASE_URL = "https://yamesi-api-demo.onrender.com"

# Single-page app: every route serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://yamesi-api-demo.onrender.com; img-src 'self' blob: https://yamesi-api-demo.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Build assets carry a content hash in their name; index.html is always revalidated.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
